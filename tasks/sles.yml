---
# tasks file for ansible-zabbix-agent
- name: Check nedded variables
  ansible.builtin.fail:
    msg: "You need to set a value for ansible_zabbix_agent__ServerAddr"
  when: ansible_zabbix_agent__ServerAddr is undefined

- name: Setup zabbix-official-repo if SLES15 or Leap
  block:
    - name: Accept Zabbix GPG Key
      ansible.builtin.rpm_key:
        state: present
        key: https://repo.zabbix.com/zabbix-official-repo.key

    - name: Configure Zabbix Repository on SLES
      community.general.zypper:
        name: "https://repo.zabbix.com/zabbix/{{ ansible_zabbix_agent__version }}/release/sles/{{  ansible_facts[\"distribution_major_version\"] }}/noarch/zabbix-release-latest-{{ ansible_zabbix_agent__version }}.sles{{ ansible_facts[\"distribution_major_version\"] }}.noarch.rpm"
        state: present
        update_cache: yes
  when: (ansible_facts["distribution_major_version"] == "15" and ansible_facts["architecture"] == "x86_64")


- name: Install Zabbix Agent
  community.general.zypper:
    name: "{{ ansible_zabbix_agent__packages }}"
    state: latest
    update_cache: yes
  register: zypper_changed

- name: Ensure old zabbix-agent is not installed
  community.general.zypper:
    name: "{{ ansible_zabbix_agent__old_packages }}"
    state: absent

- name: Reboot if MicroOS 
  ansible.builtin.reboot:
    msg: "Reboot initiated by Ansible"
    connect_timeout: 8
    reboot_timeout: 360
    pre_reboot_delay: 15
    post_reboot_delay: 180
    test_command: uptime
  register: reboot_result
  when: (zypper_changed["changed"] == True and ansible_facts["os_family"] == 'openSUSE MicroOS')

- name: Ensure /etc/zabbix/zabbix_agentd2.d exists
  ansible.builtin.file:
    path: /etc/zabbix/zabbix_agentd2.d
    state: directory
    owner: root
    group: root
    mode:  '0755'

- name: Copy zabbix_agentd.conf
  ansible.builtin.template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: 0644
  notify: Restart_zabbix_agent

- name: Copy postgresql plugin config
  ansible.builtin.template:
    src:  postgresql.conf.j2
    dest: /etc/zabbix/zabbix_agent2.d/plugins.d/postgresql.conf
    owner: root
    group: root
    mode: 0644
  notify: Restart_zabbix_agent

- name: Ensure postgresql plugin custom queries folder exist
  ansible.builtin.file:
    path: "{{ zabbix_plugin_postgresql_custom_query_path }}"
    state: directory
    owner: root
    group: root
    mode:  '0755'
  when: zabbix_plugin_postgresql_custom_query_path is defined

- name: Deploy custom postgresql queries
  ansible.builtin.copy:
    src:  "{{ zabbix_plugin_postgresql_custom_query_src_path  }}/{{ item }}"
    dest: "{{ zabbix_plugin_postgresql_custom_query_path }}/{{ item }}"
    owner: root
    group: root
    mode: 0644
  loop: "{{ zabbix_plugin_postgresql_custom_queries }}"
  when: zabbix_plugin_postgresql_custom_queries is defined

- name: Ensure zabbix_agent is set on boot time and start it
  ansible.builtin.systemd:
    name: "{{ zabbix_service_name }}"
    enabled: yes
    state: started
